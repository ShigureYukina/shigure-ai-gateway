apiVersion: 1

# 数据源自动 provision：容器起来就带上 Prometheus 数据源，不用手动点 Add data source。
# uid 与看板 JSON 里的 datasource.uid 必须一致，否则看板全空白且没有报错提示。
datasources:
  - name: Prometheus
    uid: ai-gateway-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # 与 prometheus.yml 的 scrape_interval 对齐，否则面板 $__rate_interval
      # 会请求比采集粒度更细的窗口，Prometheus 只能返回 1 个点
      timeInterval: 5s
      httpMethod: POST