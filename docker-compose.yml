services:
  redis:
    image: ${IMAGE_PREFIX:-}redis:7.2-alpine
    container_name: ai-gateway-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nacos:
    image: ${IMAGE_PREFIX:-}nacos/nacos-server:v2.3.2
    container_name: ai-gateway-nacos
    ports:
      - "8848:8848"    # HTTP 控制台 / OpenAPI（2.x 客户端 gRPC 端口 = 8848+1000，必须一起暴露）
      - "9848:9848"
      - "9849:9849"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # 应用容器：多阶段构建（Maven → layertools 分层 → JRE），见 Dockerfile
  # 必需密钥走 .env（AI_GATEWAY_DB_PASSWORD 缺失时 compose 直接报错）
  app:
    build:
      context: .
      args:
        IMAGE_PREFIX: ${IMAGE_PREFIX:-}
    image: shortlink-ai-gateway:local
    container_name: ai-gateway-app
    ports:
      - "8010:8010"
    environment:
      REDIS_HOST: redis
      AI_GATEWAY_R2DBC_URL: r2dbc:pool:mysql://mysql:3306/ai_gateway
      AI_GATEWAY_DB_PASSWORD: ${AI_GATEWAY_DB_PASSWORD:?请在 .env 中配置 AI_GATEWAY_DB_PASSWORD}
      NACOS_SERVER_ADDR: nacos:8848
      TZ: Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  mysql:
    image: ${IMAGE_PREFIX:-}mysql:8.0
    container_name: ai-gateway-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${AI_GATEWAY_DB_PASSWORD:-root}
      MYSQL_DATABASE: ai_gateway
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
