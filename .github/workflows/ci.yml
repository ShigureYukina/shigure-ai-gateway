name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    services:
      nacos:
        image: nacos/nacos-server:v2.3.2
        ports:
          - "8848:8848"
          - "9848:9848"
          - "9849:9849"
        env:
          MODE: standalone
          NACOS_AUTH_ENABLE: "false"
        options: >-
          --health-cmd "curl -fs http://localhost:8848/nacos/v1/console/health/readiness || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 集成测试用的 dataId 必须在测试进程启动前写进 Nacos； readiness 轮询兜底服务容器慢启动
      - name: Publish Nacos test config
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8848/nacos/v1/console/health/readiness; then break; fi
            sleep 2
          done
          curl -fs -X POST "http://127.0.0.1:8848/nacos/v1/cs/configs" \
            --data-urlencode "dataId=short-link-ai-gateway-it.yml" \
            --data-urlencode "group=DEFAULT_GROUP" \
            --data-urlencode "type=yaml" \
            --data-urlencode $'content=short-link:\n  ai-gateway:\n    rate-limit:\n      quota-retry-after-seconds: 99\n'

      - name: Build & Test
        env:
          NACOS_CONFIG_IT: "true"
        run: mvn -B clean verify

      - name: Package
        run: mvn -B -DskipTests package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: shortlink-ai-gateway-jar
          path: target/shortlink-ai-gateway.jar

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # 应用镜像的构建与冒烟：多阶段构建（Maven 层内嵌）→ 起依赖容器 → 跑容器 → 健康检查
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t shortlink-ai-gateway:ci .

      - name: Start dependency containers
        run: |
          docker network create ci-net
          docker run -d --name redis --network ci-net redis:7.2-alpine
          docker run -d --name mysql --network ci-net \
            -e MYSQL_ROOT_PASSWORD=ci-smoke -e MYSQL_DATABASE=ai_gateway -e TZ=Asia/Shanghai \
            mysql:8.0

      - name: Run container & smoke test
        run: |
          docker run -d --name ai-gateway-app --network ci-net -p 8010:8010 \
            -e REDIS_HOST=redis \
            -e AI_GATEWAY_R2DBC_URL=r2dbc:pool:mysql://mysql:3306/ai_gateway \
            -e AI_GATEWAY_DB_USERNAME=root -e AI_GATEWAY_DB_PASSWORD=ci-smoke \
            -e NACOS_DISCOVERY_ENABLED=false -e NACOS_REGISTER_ENABLED=false -e NACOS_CONFIG_ENABLED=false \
            shortlink-ai-gateway:ci
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8010/actuator/health | grep -q '"status":"UP"'; then
              echo "container healthy"; exit 0
            fi
            sleep 3
          done
          echo "::error::container failed to become healthy"
          docker logs ai-gateway-app | tail -80
          exit 1
