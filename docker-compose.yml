services:
  redis:
    image: ${IMAGE_PREFIX:-}redis:7.2-alpine
    container_name: ai-gateway-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nacos:
    image: ${IMAGE_PREFIX:-}nacos/nacos-server:v2.3.2
    container_name: ai-gateway-nacos
    ports:
      - "8848:8848"    # HTTP 控制台 / OpenAPI（2.x 客户端 gRPC 端口 = 8848+1000，必须一起暴露）
      - "9848:9848"
      - "9849:9849"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # 应用容器：多阶段构建（Maven → layertools 分层 → JRE），见 Dockerfile
  # 必需密钥走 .env（AI_GATEWAY_DB_PASSWORD 缺失时 compose 直接报错）
  app:
    build:
      context: .
      args:
        IMAGE_PREFIX: ${IMAGE_PREFIX:-}
    image: shortlink-ai-gateway:local
    container_name: ai-gateway-app
    ports:
      - "8010:8010"
    environment:
      REDIS_HOST: redis
      AI_GATEWAY_R2DBC_URL: r2dbc:pool:mysql://mysql:3306/ai_gateway
      AI_GATEWAY_DB_PASSWORD: ${AI_GATEWAY_DB_PASSWORD:?请在 .env 中配置 AI_GATEWAY_DB_PASSWORD}
      NACOS_SERVER_ADDR: nacos:8848
      TZ: Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  mysql:
    image: ${IMAGE_PREFIX:-}mysql:8.0
    container_name: ai-gateway-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${AI_GATEWAY_DB_PASSWORD:-root}
      MYSQL_DATABASE: ai_gateway
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # 可观测性栈：Prometheus 抓网关 /actuator/prometheus，Grafana 看板由文件自动 provision。
  # 两个服务都只读挂载配置，数据目录留在容器内（不 bind mount，重来一次就是干净的）。
  # 凭据走 .env（AI_GATEWAY_GRAFANA_PASSWORD），仅本地用，不要把这套栈直接开到公网。
  prometheus:
    image: ${IMAGE_PREFIX:-}prom/prometheus:v3.5.0
    container_name: ai-gateway-prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 本地调试只看最近一周，不设上限磁盘会随时间慢慢涨
      - --storage.tsdb.retention.time=7d
      # 允许 curl -X POST localhost:9090/-/reload 热加载抓取配置
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: ${IMAGE_PREFIX:-}grafana/grafana:11.6.0
    container_name: ai-gateway-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${AI_GATEWAY_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${AI_GATEWAY_GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # 首次登录直接落在网关看板，省得在列表里找
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ai-gateway-overview.json
      TZ: Asia/Shanghai
    volumes:
      # provisioning 目录整体只读挂进 /etc/grafana/provisioning（datasource + provider）
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      # 看板 JSON 单独挂到 provider 配置声明的路径，与 provisioning 分开挂
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
