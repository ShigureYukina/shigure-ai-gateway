spring:
  cloud:
    service-registry:
      auto-registration:
        enabled: false
    nacos:
      config:
        # 与 discovery 同策略：local 档不连 Nacos，避免后台客户端反复重连刷日志。
        # 要本地试配置中心，用 -Dspring.cloud.nacos.config.enabled=true 覆盖（compose 起 nacos 后）。
        enabled: false
      discovery:
        enabled: false
        register-enabled: false

short-link:
  ai-gateway:
    observability:
      tenant-metrics-enabled: true
      cache-event-metrics-enabled: true
      quota-event-metrics-enabled: true
