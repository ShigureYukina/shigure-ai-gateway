apiVersion: 1

# 看板 provider：把 /var/lib/grafana/dashboards 下的 JSON 自动挂进 Grafana。
# allowUiUpdates=false 意味着看板文件是唯一事实来源——在 UI 上改了不落盘，
# 下次容器重启会被 provision 覆盖回去。本地栈不希望出现"UI 改了、重启就丢"。
providers:
  - name: ai-gateway
    orgId: 1
    folder: AI Gateway
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false